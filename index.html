<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <meta
    name="description"
    content="Hybrid Home SOC Lab — a fully local security operations lab built with VMware, pfSense, Kali Linux, Ubuntu, ELK and n8n."
  >

  <meta name="theme-color" content="#080611">

  <title>Hybrid Home SOC Lab</title>

  <style>
    /* =========================================================
       ROOT / THEME
    ========================================================= */

    :root {
      --bg: #080611;
      --bg-soft: #0d0918;

      --panel: #110c1d;
      --panel-2: #171025;
      --panel-3: #1d1430;

      --border: #302047;
      --border-light: #503474;

      --text: #f5f0ff;
      --muted: #a79bb9;

      --purple: #a970ff;
      --purple-2: #7c3aed;
      --purple-3: #c084fc;

      --green: #63e6be;
      --yellow: #ffd166;
      --red: #ff6b81;
      --blue: #7dd3fc;

      --max-width: 1180px;
    }

    /* =========================================================
       RESET
    ========================================================= */

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    html {
      scroll-behavior: smooth;
      scroll-padding-top: 80px;
    }

    body {
      min-height: 100vh;
      color: var(--text);
      background:
        radial-gradient(
          circle at 15% 0%,
          rgba(124, 58, 237, 0.20),
          transparent 30%
        ),
        radial-gradient(
          circle at 90% 15%,
          rgba(169, 112, 255, 0.12),
          transparent 27%
        ),
        radial-gradient(
          circle at 50% 100%,
          rgba(192, 132, 252, 0.06),
          transparent 35%
        ),
        var(--bg);

      font-family:
        Inter,
        ui-sans-serif,
        system-ui,
        -apple-system,
        BlinkMacSystemFont,
        "Segoe UI",
        sans-serif;

      line-height: 1.6;
    }

    a {
      color: inherit;
      text-decoration: none;
    }

    img {
      max-width: 100%;
      display: block;
    }

    .container {
      width: min(var(--max-width), calc(100% - 36px));
      margin: 0 auto;
    }

    /* =========================================================
       NAVIGATION
    ========================================================= */

    nav {
      position: sticky;
      top: 0;
      z-index: 100;
      background: rgba(8, 6, 17, 0.88);
      backdrop-filter: blur(16px);
      border-bottom: 1px solid rgba(169, 112, 255, 0.18);
    }

    .nav-inner {
      min-height: 68px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 20px;
    }

    .brand {
      font-size: 0.92rem;
      font-weight: 900;
      letter-spacing: 0.04em;
      white-space: nowrap;
    }

    .brand-symbol {
      color: var(--purple);
      text-shadow: 0 0 15px rgba(169, 112, 255, 0.8);
    }

    .nav-links {
      display: flex;
      flex-wrap: wrap;
      gap: 18px;
      color: var(--muted);
      font-size: 0.82rem;
    }

    .nav-links a {
      transition: 0.2s ease;
    }

    .nav-links a:hover {
      color: var(--purple);
    }

    /* =========================================================
       HERO
    ========================================================= */

    .hero {
      position: relative;
      padding: 105px 0 85px;
      text-align: center;
      overflow: hidden;
    }

    .hero::before {
      content: "";
      position: absolute;
      width: 540px;
      height: 540px;
      left: 50%;
      top: -320px;
      transform: translateX(-50%);
      background: rgba(124, 58, 237, 0.16);
      filter: blur(110px);
      border-radius: 50%;
      pointer-events: none;
    }

    .badge {
      position: relative;
      display: inline-flex;
      align-items: center;
      gap: 8px;
      padding: 7px 13px;
      margin-bottom: 23px;
      border: 1px solid var(--border-light);
      border-radius: 999px;
      background: rgba(124, 58, 237, 0.07);
      color: var(--purple-3);
      font-size: 0.76rem;
    }

    .badge-dot {
      width: 8px;
      height: 8px;
      border-radius: 50%;
      background: var(--green);
      box-shadow: 0 0 12px rgba(99, 230, 190, 0.8);
    }

    h1 {
      position: relative;
      font-size: clamp(2.7rem, 7vw, 5.6rem);
      line-height: 1;
      letter-spacing: -0.055em;
      margin-bottom: 25px;
    }

    h1 span {
      background: linear-gradient(
        90deg,
        #a970ff,
        #c084fc,
        #8b5cf6
      );
      -webkit-background-clip: text;
      background-clip: text;
      color: transparent;
    }

    .hero-description {
      max-width: 820px;
      margin: 0 auto;
      color: var(--muted);
      font-size: clamp(0.98rem, 2vw, 1.08rem);
    }

    .actions {
      position: relative;
      margin-top: 32px;
      display: flex;
      justify-content: center;
      flex-wrap: wrap;
      gap: 12px;
    }

    .btn {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      padding: 11px 19px;
      border: 1px solid var(--border);
      border-radius: 9px;
      background: var(--panel);
      transition: 0.2s ease;
      font-size: 0.9rem;
    }

    .btn:hover {
      transform: translateY(-2px);
      border-color: var(--purple);
      box-shadow: 0 8px 25px rgba(124, 58, 237, 0.16);
    }

    .btn-primary {
      background: linear-gradient(
        135deg,
        var(--purple),
        var(--purple-2)
      );
      border-color: var(--purple);
      font-weight: 800;
      color: white;
    }

    /* =========================================================
       SECTIONS
    ========================================================= */

    section {
      padding: 62px 0;
    }

    .section-head {
      margin-bottom: 28px;
    }

    .eyebrow {
      color: var(--purple);
      font-size: 0.73rem;
      font-weight: 900;
      letter-spacing: 0.16em;
      text-transform: uppercase;
    }

    h2 {
      margin-top: 5px;
      font-size: clamp(1.8rem, 4vw, 2.7rem);
      line-height: 1.15;
      letter-spacing: -0.035em;
    }

    .section-head p {
      max-width: 790px;
      margin-top: 9px;
      color: var(--muted);
    }

    /* =========================================================
       ARCHITECTURE
    ========================================================= */

    .architecture {
      padding: 28px;
      border: 1px solid var(--border);
      border-radius: 16px;
      background:
        linear-gradient(
          145deg,
          rgba(23, 16, 38, 0.96),
          rgba(13, 9, 24, 0.96)
        );
      overflow-x: auto;
      box-shadow: 0 15px 45px rgba(0, 0, 0, 0.2);
    }

    .architecture-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 20px;
      margin-bottom: 24px;
    }

    .architecture-header strong {
      font-size: 0.98rem;
    }

    .architecture-header span {
      color: var(--muted);
      font-size: 0.72rem;
      letter-spacing: 0.08em;
    }

    .flow {
      min-width: 900px;
      display: grid;
      grid-template-columns:
        1fr 35px 1fr 35px 1fr 35px 1fr;
      align-items: center;
      gap: 10px;
    }

    .node {
      min-height: 120px;
      padding: 18px 10px;
      display: flex;
      flex-direction: column;
      justify-content: center;
      text-align: center;
      border: 1px solid var(--border);
      border-radius: 12px;
      background: var(--panel);
      transition: 0.2s ease;
    }

    .node:hover {
      transform: translateY(-3px);
      border-color: var(--purple);
      box-shadow: 0 10px 30px rgba(124, 58, 237, 0.1);
    }

    .node-icon {
      margin-bottom: 7px;
      font-size: 1.5rem;
    }

    .node strong {
      display: block;
      font-size: 0.9rem;
    }

    .node small {
      color: var(--muted);
      font-size: 0.69rem;
    }

    .arrow {
      color: var(--purple);
      text-align: center;
      font-size: 1.35rem;
    }

    .architecture-notes {
      margin-top: 17px;
      display: flex;
      flex-wrap: wrap;
      gap: 9px;
    }

    .note-pill {
      padding: 6px 11px;
      border: 1px solid var(--border);
      border-radius: 999px;
      background: rgba(124, 58, 237, 0.06);
      color: var(--purple-3);
      font-size: 0.73rem;
    }

    /* =========================================================
       CARDS
    ========================================================= */

    .cards {
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      gap: 15px;
    }

    .card {
      padding: 22px;
      border: 1px solid var(--border);
      border-radius: 14px;
      background:
        linear-gradient(
          145deg,
          rgba(23, 16, 38, 0.95),
          rgba(13, 9, 24, 0.95)
        );
      transition: 0.2s ease;
    }

    .card:hover {
      transform: translateY(-4px);
      border-color: var(--border-light);
      box-shadow: 0 15px 40px rgba(124, 58, 237, 0.1);
    }

    .card-icon {
      margin-bottom: 11px;
      font-size: 1.55rem;
    }

    .card h3 {
      margin-bottom: 6px;
      font-size: 0.98rem;
    }

    .card p {
      color: var(--muted);
      font-size: 0.84rem;
    }

    .tech {
      margin-top: 18px;
      display: flex;
      flex-wrap: wrap;
      gap: 7px;
    }

    .tag {
      padding: 5px 9px;
      border: 1px solid #382653;
      border-radius: 6px;
      background: rgba(124, 58, 237, 0.09);
      color: #d7c2f7;
      font-size: 0.7rem;
    }

    /* =========================================================
       SOC WORKFLOW
    ========================================================= */

    .workflow {
      display: grid;
      grid-template-columns: repeat(5, 1fr);
      gap: 10px;
    }

    .workflow-step {
      padding: 21px 14px;
      text-align: center;
      border: 1px solid var(--border);
      border-radius: 12px;
      background: var(--panel);
    }

    .workflow-number {
      width: 30px;
      height: 30px;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      margin-bottom: 9px;
      border: 1px solid #4b3270;
      border-radius: 50%;
      background: rgba(124, 58, 237, 0.13);
      color: var(--purple);
      font-size: 0.73rem;
      font-weight: 900;
    }

    .workflow-step h3 {
      font-size: 0.88rem;
    }

    .workflow-step p {
      margin-top: 4px;
      color: var(--muted);
      font-size: 0.71rem;
    }

    /* =========================================================
       ELK
    ========================================================= */

    .elk-box {
      padding: 26px;
      border: 1px solid var(--border);
      border-radius: 15px;
      background:
        linear-gradient(
          145deg,
          rgba(23, 16, 38, 0.96),
          rgba(13, 9, 24, 0.96)
        );
      overflow-x: auto;
    }

    .elk-flow {
      min-width: 800px;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 11px;
    }

    .elk-node {
      min-width: 145px;
      padding: 18px 13px;
      text-align: center;
      border: 1px solid var(--border);
      border-radius: 11px;
      background: var(--panel);
    }

    .elk-node strong {
      display: block;
      font-size: 0.88rem;
    }

    .elk-node small {
      display: block;
      margin-top: 3px;
      color: var(--muted);
      font-size: 0.7rem;
    }

    .elk-arrow {
      color: var(--purple);
      font-size: 1.3rem;
    }

    .elk-explanation {
      margin-top: 20px;
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 12px;
    }

    .elk-card {
      padding: 17px;
      border: 1px solid var(--border);
      border-radius: 10px;
      background: rgba(124, 58, 237, 0.035);
    }

    .elk-card strong {
      color: var(--purple-3);
      font-size: 0.85rem;
    }

    .elk-card p {
      margin-top: 4px;
      color: var(--muted);
      font-size: 0.76rem;
    }

    /* =========================================================
       INVESTIGATION
    ========================================================= */

    .investigation {
      display: grid;
      grid-template-columns: 1.1fr 0.9fr;
      gap: 16px;
    }

    .investigation-card {
      padding: 24px;
      border: 1px solid var(--border);
      border-radius: 14px;
      background: var(--panel);
    }

    .investigation-card h3 {
      margin-bottom: 10px;
      font-size: 1rem;
    }

    .investigation-card p {
      color: var(--muted);
      font-size: 0.84rem;
    }

    .alert-box {
      margin-top: 17px;
      padding: 15px;
      border: 1px solid rgba(255, 107, 129, 0.3);
      border-radius: 9px;
      background: rgba(255, 107, 129, 0.05);
    }

    .alert-box strong {
      color: var(--red);
      font-size: 0.82rem;
    }

    .alert-box p {
      margin-top: 3px;
      font-size: 0.75rem;
    }

    /* =========================================================
       TERMINAL
    ========================================================= */

    .terminal {
      margin-top: 20px;
      overflow: hidden;
      border: 1px solid var(--border);
      border-radius: 12px;
      background: #08060d;
    }

    .terminal-header {
      padding: 10px 14px;
      border-bottom: 1px solid var(--border);
      color: var(--muted);
      font-family: monospace;
      font-size: 0.72rem;
    }

    .terminal-body {
      padding: 19px;
      overflow-x: auto;
      color: #cec3df;
      font-family: "SFMono-Regular", Consolas, monospace;
      font-size: 0.76rem;
    }

    .prompt {
      color: var(--purple);
    }

    .success {
      color: var(--green);
    }

    .danger {
      color: var(--red);
    }

    /* =========================================================
       AUTOMATION
    ========================================================= */

    .automation {
      padding: 25px;
      overflow-x: auto;
      border: 1px solid var(--border);
      border-radius: 14px;
      background: var(--panel);
    }

    .automation-flow {
      min-width: 800px;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 10px;
    }

    .automation-node {
      min-width: 140px;
      padding: 17px;
      text-align: center;
      border: 1px solid var(--border);
      border-radius: 11px;
      background: var(--panel-2);
    }

    .automation-node strong {
      display: block;
      font-size: 0.88rem;
    }

    .automation-node small {
      display: block;
      margin-top: 3px;
      color: var(--muted);
      font-size: 0.69rem;
    }

    .automation-arrow {
      color: var(--purple);
      font-size: 1.25rem;
    }

    /* =========================================================
       DOCUMENTATION
    ========================================================= */

    .docs {
      display: grid;
      grid-template-columns: repeat(2, 1fr);
      gap: 12px;
    }

    .doc {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 15px;
      padding: 17px 18px;
      border: 1px solid var(--border);
      border-radius: 11px;
      background: var(--panel);
      transition: 0.2s ease;
    }

    .doc:hover {
      transform: translateX(2px);
      border-color: var(--purple);
    }

    .doc strong {
      font-size: 0.88rem;
    }

    .doc small {
      display: block;
      margin-top: 2px;
      color: var(--muted);
      font-size: 0.72rem;
    }

    .doc-arrow {
      color: var(--purple);
      font-size: 1.15rem;
    }

    /* =========================================================
       STATUS
    ========================================================= */

    .status-grid {
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      gap: 12px;
    }

    .status {
      padding: 18px;
      border: 1px solid var(--border);
      border-radius: 12px;
      background: var(--panel);
    }

    .state {
      font-size: 0.69rem;
      font-weight: 900;
      letter-spacing: 0.09em;
      text-transform: uppercase;
    }

    .state.live {
      color: var(--green);
    }

    .state.building {
      color: var(--purple);
    }

    .state.hold {
      color: var(--yellow);
    }

    .state.previous {
      color: var(--muted);
    }

    .status h3 {
      margin-top: 5px;
      font-size: 0.92rem;
    }

    .status p {
      margin-top: 4px;
      color: var(--muted);
      font-size: 0.73rem;
    }

    /* =========================================================
       TIMELINE
    ========================================================= */

    .timeline {
      margin-left: 8px;
      padding-left: 25px;
      border-left: 1px solid var(--border);
    }

    .timeline-item {
      position: relative;
      margin-bottom: 25px;
    }

    .timeline-item:last-child {
      margin-bottom: 0;
    }

    .timeline-item::before {
      content: "";
      position: absolute;
      left: -30px;
      top: 8px;
      width: 9px;
      height: 9px;
      border-radius: 50%;
      background: var(--purple);
      box-shadow: 0 0 12px rgba(169, 112, 255, 0.65);
    }

    .timeline-item strong {
      font-size: 0.94rem;
    }

    .timeline-item p {
      margin-top: 3px;
      color: var(--muted);
      font-size: 0.81rem;
    }

    /* =========================================================
       ROADMAP
    ========================================================= */

    .roadmap {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 14px;
    }

    .roadmap-card {
      padding: 21px;
      border: 1px solid var(--border);
      border-radius: 13px;
      background: var(--panel);
    }

    .roadmap-card .roadmap-status {
      margin-bottom: 9px;
      color: var(--purple);
      font-size: 0.68rem;
      font-weight: 900;
      letter-spacing: 0.12em;
      text-transform: uppercase;
    }

    .roadmap-card h3 {
      font-size: 0.95rem;
    }

    .roadmap-card p {
      margin-top: 5px;
      color: var(--muted);
      font-size: 0.77rem;
    }

    /* =========================================================
       HIGHLIGHT
    ========================================================= */

    .highlight {
      margin-top: 22px;
      padding: 19px;
      border: 1px solid #3b2855;
      border-radius: 11px;
      background: rgba(124, 58, 237, 0.045);
    }

    .highlight strong {
      color: var(--purple-3);
    }

    .highlight p {
      margin-top: 4px;
      color: var(--muted);
      font-size: 0.83rem;
    }

    /* =========================================================
       FOOTER
    ========================================================= */

    footer {
      margin-top: 35px;
      padding: 40px 0;
      border-top: 1px solid var(--border);
      background: rgba(5, 4, 10, 0.5);
    }

    .footer-inner {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 20px;
    }

    .footer-title {
      font-weight: 800;
      font-size: 0.9rem;
    }

    .footer-text {
      margin-top: 3px;
      color: var(--muted);
      font-size: 0.73rem;
    }

    .footer-link {
      color: var(--purple-3);
      font-size: 0.8rem;
    }

    .footer-link:hover {
      color: white;
    }

    /* =========================================================
       RESPONSIVE
    ========================================================= */

    @media (max-width: 980px) {
      .cards {
        grid-template-columns: repeat(2, 1fr);
      }

      .workflow {
        grid-template-columns: repeat(2, 1fr);
      }

      .status-grid {
        grid-template-columns: repeat(2, 1fr);
      }

      .investigation {
        grid-template-columns: 1fr;
      }

      .roadmap {
        grid-template-columns: 1fr;
      }
    }

    @media (max-width
