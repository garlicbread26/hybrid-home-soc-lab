<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="Hybrid Home SOC Lab — network security, cloud infrastructure, Wazuh SIEM, detection engineering, SOC investigation, automation and troubleshooting.">
  <title>Hybrid Home SOC Lab</title>

  <style>
    :root {
      --bg: #07110d;
      --panel: #0b1813;
      --panel-2: #0e2019;
      --border: #17392b;
      --text: #e7f5ed;
      --muted: #8ba99a;
      --accent: #42f59b;
      --accent-2: #1bd47c;
      --warning: #ffd166;
      --max: 1180px;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }

    html { scroll-behavior: smooth; }

    body {
      background:
        radial-gradient(circle at 20% 0%, rgba(66,245,155,.08), transparent 28%),
        radial-gradient(circle at 90% 20%, rgba(27,212,124,.06), transparent 25%),
        var(--bg);
      color: var(--text);
      font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      line-height: 1.6;
    }

    a {
      color: inherit;
      text-decoration: none;
    }

    .container {
      width: min(var(--max), calc(100% - 36px));
      margin: auto;
    }

    nav {
      position: sticky;
      top: 0;
      z-index: 10;
      backdrop-filter: blur(14px);
      background: rgba(7,17,13,.82);
      border-bottom: 1px solid var(--border);
    }

    .nav-inner {
      min-height: 66px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 20px;
    }

    .brand {
      font-weight: 800;
      letter-spacing: .04em;
    }

    .brand span {
      color: var(--accent);
    }

    .nav-links {
      display: flex;
      gap: 20px;
      color: var(--muted);
      font-size: .92rem;
    }

    .nav-links a:hover {
      color: var(--accent);
    }

    .hero {
      padding: 92px 0 70px;
      text-align: center;
    }

    .badge {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      padding: 7px 12px;
      border: 1px solid var(--border);
      border-radius: 999px;
      color: var(--accent);
      background: rgba(66,245,155,.05);
      font-size: .82rem;
      margin-bottom: 22px;
    }

    .dot {
      width: 8px;
      height: 8px;
      border-radius: 50%;
      background: var(--accent);
      box-shadow: 0 0 12px var(--accent);
    }

    h1 {
      font-size: clamp(2.4rem, 6vw, 5.2rem);
      line-height: 1.02;
      letter-spacing: -.045em;
      margin-bottom: 22px;
    }

    h1 span {
      color: var(--accent);
    }

    .hero p {
      max-width: 780px;
      margin: auto;
      color: var(--muted);
      font-size: 1.08rem;
    }

    .actions {
      margin-top: 30px;
      display: flex;
      justify-content: center;
      flex-wrap: wrap;
      gap: 12px;
    }

    .btn {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      padding: 11px 18px;
      border-radius: 9px;
      border: 1px solid var(--border);
      background: var(--panel);
      transition: .2s;
    }

    .btn.primary {
      background: var(--accent);
      color: #04100a;
      border-color: var(--accent);
      font-weight: 800;
    }

    .btn:hover {
      transform: translateY(-2px);
      border-color: var(--accent);
    }

    section {
      padding: 58px 0;
    }

    .section-head {
      margin-bottom: 28px;
    }

    .eyebrow {
      color: var(--accent);
      font-size: .78rem;
      font-weight: 800;
      letter-spacing: .15em;
      text-transform: uppercase;
    }

    h2 {
      font-size: clamp(1.8rem, 4vw, 2.7rem);
      margin-top: 5px;
    }

    .section-head p {
      color: var(--muted);
      max-width: 760px;
      margin-top: 8px;
    }

    .architecture {
      padding: 28px;
      background: linear-gradient(180deg, rgba(14,32,25,.9), rgba(11,24,19,.9));
      border: 1px solid var(--border);
      border-radius: 16px;
      overflow-x: auto;
    }

    .flow {
      min-width: 720px;
      display: grid;
      grid-template-columns: repeat(5, 1fr);
      align-items: center;
      gap: 12px;
    }

    .node {
      padding: 18px 12px;
      text-align: center;
      border: 1px solid var(--border);
      border-radius: 12px;
      background: var(--panel);
    }

    .node strong {
      display: block;
    }

    .node small {
      color: var(--muted);
    }

    .arrow {
      text-align: center;
      color: var(--accent);
      font-size: 1.5rem;
    }

    .automation-flow {
      margin-top: 18px;
      padding: 24px;
      background: var(--panel);
      border: 1px solid var(--border);
      border-radius: 14px;
      overflow-x: auto;
    }

    .automation-track {
      min-width: 700px;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 12px;
    }

    .automation-node {
      min-width: 150px;
      padding: 18px;
      text-align: center;
      border: 1px solid var(--border);
      border-radius: 12px;
      background: var(--panel-2);
    }

    .automation-node strong {
      display: block;
      margin-bottom: 4px;
    }

    .automation-node small {
      color: var(--muted);
    }

    .cards {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 16px;
    }

    .card {
      padding: 22px;
      background: var(--panel);
      border: 1px solid var(--border);
      border-radius: 14px;
      transition: .2s;
    }

    .card:hover {
      transform: translateY(-3px);
      border-color: rgba(66,245,155,.55);
    }

    .card .icon {
      font-size: 1.5rem;
      margin-bottom: 12px;
    }

    .card h3 {
      margin-bottom: 6px;
    }

    .card p {
      color: var(--muted);
      font-size: .94rem;
    }

    .tech {
      margin-top: 18px;
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
    }

    .tag {
      padding: 5px 9px;
      border-radius: 6px;
      background: rgba(66,245,155,.06);
      border: 1px solid var(--border);
      color: #bcebd1;
      font-size: .78rem;
    }

    .docs {
      display: grid;
      grid-template-columns: repeat(2, 1fr);
      gap: 12px;
    }

    .doc {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 15px;
      padding: 17px 18px;
      border: 1px solid var(--border);
      background: var(--panel);
      border-radius: 11px;
      transition: .2s;
    }

    .doc:hover {
      border-color: var(--accent);
      color: var(--accent);
    }

    .doc small {
      display: block;
      color: var(--muted);
      margin-top: 2px;
    }

    .status-grid {
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      gap: 12px;
    }

    .status {
      padding: 18px;
      background: var(--panel);
      border: 1px solid var(--border);
      border-radius: 12px;
    }

    .status .state {
      color: var(--accent);
      font-size: .78rem;
      font-weight: 800;
      text-transform: uppercase;
      letter-spacing: .08em;
    }

    .status h3 {
      margin-top: 5px;
    }

    .timeline {
      border-left: 1px solid var(--border);
      margin-left: 8px;
      padding-left: 25px;
    }

    .timeline-item {
      position: relative;
      margin-bottom: 22px;
    }

    .timeline-item::before {
      content: "";
      position: absolute;
      width: 9px;
      height: 9px;
      border-radius: 50%;
      background: var(--accent);
      left: -30px;
      top: 8px;
      box-shadow: 0 0 12px rgba(66,245,155,.5);
    }

    .timeline-item p {
      color: var(--muted);
    }

    .highlight {
      margin-top: 24px;
      padding: 20px;
      border: 1px solid var(--border);
      border-radius: 12px;
      background: rgba(66,245,155,.035);
    }

    .highlight strong {
      color: var(--accent);
    }

    footer {
      border-top: 1px solid var(--border);
      margin-top: 30px;
      padding: 30px 0 45px;
      color: var(--muted);
      text-align: center;
      font-size: .88rem;
    }

    @media (max-width: 850px) {
      .cards {
        grid-template-columns: 1fr 1fr;
      }

      .status-grid {
        grid-template-columns: 1fr 1fr;
      }
    }

    @media (max-width: 620px) {
      .nav-links {
        display: none;
      }

      .hero {
        padding-top: 65px;
      }

      .cards,
      .docs,
      .status-grid {
        grid-template-columns: 1fr;
      }

      .architecture {
        padding: 18px;
      }
    }
  </style>
</head>

</nav>
