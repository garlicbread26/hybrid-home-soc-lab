<!DOCTYPE html>
<html lang="en">

<head>

  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
  >

  <meta
    name="description"
    content="Hybrid Home SOC Lab — a fully local security operations lab built with VMware, pfSense, Kali Linux, Ubuntu, ELK, n8n, DVWA, Juice Shop, T-Pot and Caldera."
  >

  <meta name="theme-color" content="#080611">

  <title>Hybrid Home SOC Lab</title>


  <style>

    /* =========================================================
       THEME
    ========================================================= */

    :root {

      --bg: #080611;
      --bg-soft: #0d0918;

      --panel: #110c1d;
      --panel-2: #171025;
      --panel-3: #1d1430;

      --border: #302047;
      --border-light: #422c61;

      --text: #f5f0ff;
      --muted: #a79bb9;

      --purple: #a970ff;
      --purple-2: #7c3aed;
      --purple-3: #c084fc;

      --green: #63e6be;
      --yellow: #ffd166;
      --red: #ff6b81;
      --blue: #7dd3fc;

      --max-width: 1180px;

    }


    /* =========================================================
       RESET
    ========================================================= */

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    html {
      scroll-behavior: smooth;
    }

    body {

      min-height: 100vh;

      background:

        radial-gradient(
          circle at 15% 0%,
          rgba(124, 58, 237, .20),
          transparent 31%
        ),

        radial-gradient(
          circle at 90% 15%,
          rgba(169, 112, 255, .12),
          transparent 27%
        ),

        radial-gradient(
          circle at 50% 100%,
          rgba(192, 132, 252, .06),
          transparent 35%
        ),

        var(--bg);

      color: var(--text);

      font-family:
        Inter,
        ui-sans-serif,
        system-ui,
        -apple-system,
        BlinkMacSystemFont,
        "Segoe UI",
        sans-serif;

      line-height: 1.6;

    }

    a {
      color: inherit;
      text-decoration: none;
    }


    .container {

      width:
        min(
          var(--max-width),
          calc(100% - 36px)
        );

      margin: auto;

    }


    /* =========================================================
       NAVIGATION
    ========================================================= */

    nav {

      position: sticky;

      top: 0;

      z-index: 100;

      background:
        rgba(8, 6, 17, .86);

      backdrop-filter:
        blur(16px);

      border-bottom:
        1px solid
        rgba(169, 112, 255, .18);

    }


    .nav-inner {

      min-height: 68px;

      display: flex;

      align-items: center;

      justify-content: space-between;

      gap: 20px;

    }


    .brand {

      font-weight: 900;

      letter-spacing: .045em;

      font-size: .92rem;

      white-space: nowrap;

    }


    .brand-symbol {

      color: var(--purple);

      text-shadow:
        0 0 15px
        rgba(169, 112, 255, .8);

    }


    .nav-links {

      display: flex;

      gap: 20px;

      color: var(--muted);

      font-size: .87rem;

    }


    .nav-links a {

      transition:
        .2s ease;

    }


    .nav-links a:hover {

      color:
        var(--purple);

    }


    /* =========================================================
       HERO
    ========================================================= */

    .hero {

      position: relative;

      padding:
        105px
        0
        82px;

      text-align: center;

      overflow: hidden;

    }


    .hero::before {

      content: "";

      position: absolute;

      width: 540px;

      height: 540px;

      left: 50%;

      top: -320px;

      transform:
        translateX(-50%);

      background:
        rgba(124, 58, 237, .15);

      filter:
        blur(110px);

      border-radius: 50%;

      pointer-events: none;

    }


    .badge {

      position: relative;

      display: inline-flex;

      align-items: center;

      gap: 8px;

      padding:
        7px
        13px;

      border:
        1px solid
        var(--border-light);

      border-radius: 999px;

      background:
        rgba(124, 58, 237, .07);

      color:
        var(--purple-3);

      font-size: .78rem;

      margin-bottom: 23px;

    }


    .badge-dot {

      width: 8px;

      height: 8px;

      border-radius: 50%;

      background:
        var(--green);

      box-shadow:
        0 0 12px
        rgba(99, 230, 190, .8);

    }


    h1 {

      position: relative;

      font-size:
        clamp(
          2.5rem,
          6vw,
          5.4rem
        );

      line-height: 1.01;

      letter-spacing: -.055em;

      margin-bottom: 25px;

    }


    h1 span {

      background:
        linear-gradient(
          90deg,
          #a970ff,
          #c084fc,
          #8b5cf6
        );

      -webkit-background-clip: text;

      background-clip: text;

      color: transparent;

    }


    .hero-description {

      max-width: 820px;

      margin: auto;

      color: var(--muted);

      font-size:
        clamp(
          .98rem,
          2vw,
          1.08rem
        );

    }


    .actions {

      position: relative;

      margin-top: 32px;

      display: flex;

      justify-content: center;

      flex-wrap: wrap;

      gap: 12px;

    }


    .btn {

      display: inline-flex;

      align-items: center;

      justify-content: center;

      padding:
        11px
        19px;

      border:
        1px solid
        var(--border);

      border-radius: 9px;

      background:
        var(--panel);

      transition:
        .2s ease;

      font-size: .9rem;

    }


    .btn:hover {

      transform:
        translateY(-2px);

      border-color:
        var(--purple);

      box-shadow:
        0 8px 25px
        rgba(124, 58, 237, .16);

    }


    .btn-primary {

      background:
        linear-gradient(
          135deg,
          var(--purple),
          var(--purple-2)
        );

      border-color:
        var(--purple);

      font-weight: 800;

      color: white;

    }


    /* =========================================================
       GENERAL SECTIONS
    ========================================================= */

    section {

      padding:
        62px
        0;

    }


    .section-head {

      margin-bottom:
        28px;

    }


    .eyebrow {

      color:
        var(--purple);

      font-size:
        .75rem;

      font-weight:
        900;

      letter-spacing:
        .16em;

      text-transform:
        uppercase;

    }


    h2 {

      font-size:
        clamp(
          1.8rem,
          4vw,
          2.7rem
        );

      letter-spacing:
        -.035em;

      margin-top:
        5px;

    }


    .section-head p {

      max-width:
        790px;

      margin-top:
        8px;

      color:
        var(--muted);

    }


    /* =========================================================
       ARCHITECTURE
    ========================================================= */

    .architecture {

      padding:
        28px;

      border:
        1px solid
        var(--border);

      border-radius:
        16px;

      background:
        linear-gradient(
          145deg,
          rgba(23,16,38,.96),
          rgba(13,9,24,.96)
        );

      overflow-x:
        auto;

      box-shadow:
        0 15px 45px
        rgba(0,0,0,.20);

    }


    .architecture-header {

      display:
        flex;

      justify-content:
        space-between;

      align-items:
        center;

      margin-bottom:
        24px;

      gap:
        20px;

    }


    .architecture-header strong {

      font-size:
        .98rem;

    }


    .architecture-header span {

      color:
        var(--muted);

      font-size:
        .72rem;

      letter-spacing:
        .08em;

    }


    .flow {

      min-width:
        900px;

      display:
        grid;

      grid-template-columns:
        1fr
        35px
        1fr
        35px
        1fr
        35px
        1fr;

      align-items:
        center;

      gap:
        10px;

    }


    .node {

      min-height:
        110px;

      padding:
        18px
        10px;

      display:
        flex;

      flex-direction:
        column;

      justify-content:
        center;

      text-align:
        center;

      border:
        1px solid
        var(--border);

      border-radius:
        12px;

      background:
        var(--panel);

      transition:
        .2s ease;

    }


    .node:hover {

      border-color:
        var(--purple);

      transform:
        translateY(-2px);

    }


    .node-icon {

      font-size:
        1.45rem;

      margin-bottom:
        7px;

    }


    .node strong {

      display:
        block;

      font-size:
        .9rem;

    }


    .node small {

      color:
        var(--muted);

      font-size:
        .69rem;

    }


    .arrow {

      text-align:
        center;

      color:
        var(--purple);

      font-size:
        1.35rem;

    }


    .architecture-notes {

      margin-top:
        17px;

      display:
        flex;

      flex-wrap:
        wrap;

      gap:
        9px;

    }


    .note-pill {

      padding:
        6px
        11px;

      border:
        1px solid
        var(--border);

      border-radius:
        999px;

      background:
        rgba(124,58,237,.06);

      color:
        var(--purple-3);

      font-size:
        .73rem;

    }


    /* =========================================================
       COMPONENTS
    ========================================================= */

    .cards {

      display:
        grid;

      grid-template-columns:
        repeat(4, 1fr);

      gap:
        15px;

    }


    .card {

      padding:
        22px;

      border:
        1px solid
        var(--border);

      border-radius:
        14px;

      background:
        linear-gradient(
          145deg,
          rgba(23,16,38,.95),
          rgba(13,9,24,.95)
        );

      transition:
        .2s ease;

    }


    .card:hover {

      transform:
        translateY(-4px);

      border-color:
        var(--border-light);

      box-shadow:
        0 15px 40px
        rgba(124,58,237,.10);

    }


    .card-icon {

      font-size:
        1.55rem;

      margin-bottom:
        11px;

    }


    .card h3 {

      font-size:
        .98rem;

      margin-bottom:
        6px;

    }


    .card p {

      color:
        var(--muted);

      font-size:
        .85rem;

    }


    .tech {

      margin-top:
        20px;

      display:
        flex;

      flex-wrap:
        wrap;

      gap:
        7px;

    }


    .tag {

      padding:
        5px
        9px;

      border:
        1px solid
        #382653;

      border-radius:
        6px;

      background:
        rgba(124,58,237,.09);

      color:
        #d7c2f7;

      font-size:
        .73rem;

    }


    /* =========================================================
       SOC WORKFLOW
    ========================================================= */

    .workflow {

      display:
        grid;

      grid-template-columns:
        repeat(5, 1fr);

      gap:
        10px;

    }


    .workflow-step {

      padding:
        21px
        14px;

      text-align:
        center;

      border:
        1px solid
        var(--border);

      border-radius:
        12px;

      background:
        var(--panel);

    }


    .workflow-number {

      width:
        30px;

      height:
        30px;

      display:
        inline-flex;

      align-items:
        center;

      justify-content:
        center;

      border-radius:
        50%;

      background:
        rgba(124,58,237,.13);

      border:
        1px solid
        #4b3270;

      color:
        var(--purple);

      font-weight:
        900;

      font-size:
        .73rem;

      margin-bottom:
        9px;

    }


    .workflow-step h3 {

      font-size:
        .88rem;

    }


    .workflow-step p {

      margin-top:
        4px;

      color:
        var(--muted);

      font-size:
        .71rem;

    }


    /* =========================================================
       ELK PIPELINE
    ========================================================= */

    .elk-box {

      padding:
        26px;

      border:
        1px solid
        var(--border);

      border-radius:
        15px;

      background:
        linear-gradient(
          145deg,
          rgba(23,16,38,.96),
          rgba(13,9,24,.96)
        );

      overflow-x:
        auto;

    }


    .elk-flow {

      min-width:
        800px;

      display:
        flex;

      align-items:
        center;

      justify-content:
        center;

      gap:
        11px;

    }


    .elk-node {

      min-width:
        145px;

      padding:
        18px
        13px;

      text-align:
        center;

      border:
        1px solid
        var(--border);

      border-radius:
        11px;

      background:
        var(--panel);

    }


    .elk-node strong {

      display:
        block;

      font-size:
        .88rem;

    }


    .elk-node small {

      display:
        block;

      margin-top:
        3px;

      color:
        var(--muted);

      font-size:
        .7rem;

    }


    .elk-arrow {

      color:
        var(--purple);

      font-size:
        1.3rem;

    }


    .elk-explanation {

      margin-top:
        20px;

      display:
        grid;

      grid-template-columns:
        repeat(3,1fr);

      gap:
        12px;

    }


    .elk-card {

      padding:
        17px;

      border:
        1px solid
        var(--border);

      border-radius:
        10px;

      background:
        rgba(124,58,237,.035);

    }


    .elk-card strong {

      color:
        var(--purple-3);

      font-size:
        .85rem;

    }


    .elk-card p {

      color:
        var(--muted);

      font-size:
        .76rem;

      margin-top:
        4px;

    }


    /* =========================================================
       AUTOMATION
    ========================================================= */

    .automation {

      padding:
        25px;

      border:
        1px solid
        var(--border);

      border-radius:
        14px;

      background:
        var(--panel);

      overflow-x:
        auto;

    }


    .automation-flow {

      min-width:
        800px;

      display:
        flex;

      justify-content:
        center;

      align-items:
        center;

      gap:
        10px;

    }


    .automation-node {

      min-width:
        140px;

      padding:
        17px;

      text-align:
        center;

      border:
        1px solid
        var(--border);

      border-radius:
        11px;

      background:
        var(--panel-2);

    }


    .automation-node strong {

      display:
        block;

      font-size:
        .88rem;

    }


    .automation-node small {

      display:
        block;

      color:
        var(--muted);

      font-size:
        .69rem;

      margin-top:
        3px;

    }


    .automation-arrow {

      color:
        var(--purple);

      font-size:
        1.25rem;

    }


    /* =========================================================
       DOCUMENTATION
    ========================================================= */

    .docs {

      display:
        grid;

      grid-template-columns:
        repeat(2,1fr);

      gap:
        12px;

    }


    .doc {

      display:
        flex;

      align-items:
        center;

      justify-content:
        space-between;

      gap:
        15px;

      padding:
        17px
        18px;

      border:
        1px solid
        var(--border);

      border-radius:
        11px;

      background:
        var(--panel);

      transition:
        .2s ease;

    }


    .doc:hover {

      border-color:
        var(--purple);

      transform:
        translateX(2px);

    }


    .doc strong {

      font-size:
        .88rem;

    }


    .doc small {

      display:
        block;

      color:
        var(--muted);

      font-size:
        .72rem;

      margin-top:
        2px;

    }


    .doc-arrow {

      color:
        var(--purple);

      font-size:
        1.15rem;

    }


    /* =========================================================
       STATUS
    ========================================================= */

    .status-grid {

      display:
        grid;

      grid-template-columns:
        repeat(4,1fr);

      gap:
        12px;

    }


    .status {

      padding:
        18px;

      border:
        1px solid
        var(--border);

      border-radius:
        12px;

      background:
        var(--panel);

    }


    .state {

      font-size:
        .69rem;

      font-weight:
        900;

      letter-spacing:
        .09em;

      text-transform:
        uppercase;

    }


    .state.live {
      color:
        var(--green);
    }


    .state.building {
      color:
        var(--purple);
    }


    .state.hold {
      color:
        var(--yellow);
    }


    .state.previous {
      color:
        var(--muted);
    }


    .status h3 {

      margin-top:
        5px;

      font-size:
        .92rem;

    }


    .status p {

      color:
        var(--muted);

      font-size:
        .73rem;

      margin-top:
        4px;

    }


    /* =========================================================
       TIMELINE
    ========================================================= */

    .timeline {

      border-left:
        1px solid
        var(--border);

      margin-left:
        8px;

      padding-left:
        25px;

    }


    .timeline-item {

      position:
        relative;

      margin-bottom:
        25px;

    }


    .timeline-item::before {

      content:
        "";

      position:
        absolute;

      width:
        9px;

      height:
        9px;

      border-radius:
        50%;

      background:
        var(--purple);

      left:
        -30px;

      top:
        8px;

      box-shadow:
        0 0 12px
        rgba(169,112,255,.65);

    }


    .timeline-item strong {

      font-size:
        .94rem;

    }


    .timeline-item p {

      color:
        var(--muted);

      font-size:
        .81rem;

      margin-top:
        3px;

    }


    /* =========================================================
       HIGHLIGHT
    ========================================================= */

    .highlight {

      margin-top:
        22px;

      padding:
        19px;

      border:
        1px solid
        #3b2855;

      border-radius:
        11px;

      background:
        rgba(124,58,237,.045);

    }


    .highlight strong {

      color:
        var(--purple-3);

    }


    .highlight p {

      color:
        var(--muted);

      font-size:
        .83rem;

      margin-top:
        4px;

    }


    /* =========================================================
       TERMINAL
    ========================================================= */

    .terminal {

      margin-top:
        22px;

      border:
        1px solid
        var(--border);

      border-radius:
        12px;

      overflow:
        hidden;

      background:
        #08060d;

    }


    .terminal-header {

      padding:
        10px
        14px;

      border-bottom:
        1px solid
        var(--border);

      color:
        var(--muted);

      font-family:
        monospace;

      font-size:
        .72rem;

    }


    .terminal-body {

      padding:
        19px;

      font-family:
        "SFMono-Regular",
        Consolas,
        monospace;

      font-size:
        .76rem;

      color:
        #cec3df;

      overflow-x:
        auto;

    }


    .prompt {
      color:
        var(--purple);
    }


    .success {
      color:
